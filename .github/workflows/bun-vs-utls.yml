name: bun-vs-utls

# 同 IP / 同 session / 同 body / 同 UA，只换传输层：
#   B  utls    opencode2api 的 BunTransport（uTLS 复刻 Bun 的 ClientHello + fetch 头序）
#   A  bun     bun fetch（对照，证明这个 IP 的配额和 body 都没问题）
#   C  stdlib  Go crypto/tls（阴性对照）
#
# 判定：
#   B=200 且 A=200            → 用 uTLS 可以摆脱 bun
#   B=429 且 A=200            → 只复刻 ClientHello 还不够（还有别的指纹）
#   A=429                     → 这个 IP 脏/配额空，本 shard 作废

on:
  push:
    branches: [tls-ab]
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: install bun + opencode cli
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_ab"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          # C0：官方 CLI（跑在 bun 上）能通，才算这个 IP 干净
          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          REAL=$(python3 - <<'PY'
          import os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          try:
              con = sqlite3.connect(db)
              for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
                  try:
                      rows = con.execute("select * from %s order by rowid desc limit 40" % t).fetchall()
                  except Exception:
                      continue
                  for row in rows:
                      for v in row:
                          if isinstance(v, str):
                              m = re.findall(r"ses_[0-9A-Za-z]{20,}", v)
                              if m:
                                  print(m[0]); raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass
          PY
          )
          echo "REAL=$REAL"; [ -n "$REAL" ] || exit 0

          # 探针要 import opencode2api 的 internal/httpx，只能放进它自己的模块树里编译
          git clone --depth 1 https://github.com/jasonxu114514/opencode2api "$W/o2a" 2>&1 | tail -1
          mkdir -p "$W/o2a/cmd/abprobe"
          cp tools/abprobe/main.go "$W/o2a/cmd/abprobe/main.go"
          (cd "$W/o2a" && go build -tags abprobe -o "$W/abprobe" ./cmd/abprobe)
          echo "abprobe: $(ls -l "$W/abprobe" | awk '{print $5}') bytes"

          # B 先跑：先跑 bun 会先吃掉配额，B 的 429 就分不清是配额还是指纹
          echo "=== B: uTLS (opencode2api BunTransport) ==="
          "$W/abprobe" -mode utls -session "$REAL" -body "$PWD/tools/cli_capture_body.json" || true
          sleep 2

          echo "=== A: bun fetch (control) ==="
          cat > "$W/bun.js" <<'JS'
          const fs = require("fs");
          const body = fs.readFileSync(process.env.BODY, "utf8");
          const ses = process.env.SES;
          const headers = {
            "Authorization": "Bearer public",
            "Content-Type": "application/json",
            "User-Agent": "opencode/latest/2.0.29/cli",
            "X-Opencode-Client": "cli",
            "X-Opencode-Project": "global",
            "X-Opencode-Session": ses,
            "X-Opencode-Session-Id": ses,
            "X-Session-Affinity": ses,
            "X-Session-Id": ses,
          };
          const r = await fetch("https://opencode.ai/inference/v1/chat/completions",
            { method: "POST", headers, body });
          const t = await r.text();
          console.log("AB bun ses=" + ses + " -> " + r.status + " " + JSON.stringify(t.slice(0, 200)));
          process.exit(r.status === 200 ? 0 : 1);
          JS
          BODY="$PWD/tools/cli_capture_body.json" SES="$REAL" "$HOME/.bun/bin/bun" "$W/bun.js" || true
          sleep 2

          echo "=== C: Go stdlib TLS (negative control) ==="
          "$W/abprobe" -mode stdlib -session "$REAL" -body "$PWD/tools/cli_capture_body.json" || true
