name: tls-fingerprint

# C 方案验证：Go + uTLS 能不能复刻出上游认的 TLS 指纹。
#
# job capture：把 opencode.ai 临时指到本地中继，抄下 Bun / Node / curl 的 ClientHello，
#              用来判断 Bun 的指纹像不像某个已知 preset（Chrome/Firefox/Safari）。
# job utls   ：每个分片一台干净 IP，先跑真 CLI 控制组，再用 uTLS 的 preset 发同样的 body。
#
# 判定：某个 preset 返回 200 → C 方案成立（单进程单二进制，不依赖 bun）。
#       全部 429/403 → 只能继续用 Bun sidecar（A 方案）。

on:
  workflow_dispatch:
    inputs:
      only:
        description: "capture = 只跑指纹抓取；空 = 全跑"
        required: false
        default: ""

jobs:
  capture:
    if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'capture' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: capture ClientHello
        run: |
          set -u
          export PATH="$HOME/.bun/bin:$PATH"
          REAL_IP=$(getent ahostsv4 opencode.ai | awk '{print $1}' | head -1)
          echo "real ip: $REAL_IP"
          sudo python3 tools/hello_relay.py "$REAL_IP" 443 > /tmp/relay.log 2>&1 &
          sleep 2
          cat /tmp/relay.log
          echo "127.0.0.1 opencode.ai" | sudo tee -a /etc/hosts >/dev/null
          getent hosts opencode.ai | head -2

          echo "=== bun fetch ==="
          "$HOME/.bun/bin/bun" -e 'fetch("https://opencode.ai/inference/v1/models").then(r=>console.log("bun status",r.status)).catch(e=>console.log("bun err",e.message))' || true
          sleep 2
          echo "=== node https ==="
          node -e 'require("https").get("https://opencode.ai/inference/v1/models",r=>{console.log("node status",r.statusCode);process.exit(0)}).on("error",e=>{console.log("node err",e.message);process.exit(0)})' || true
          sleep 2
          echo "=== curl ==="
          curl -s -o /dev/null -w 'curl status %{http_code}\n' https://opencode.ai/inference/v1/models || true
          sleep 2
          echo "=== relay output ==="
          cat /tmp/relay.log

  utls:
    if: ${{ github.event.inputs.only == '' || github.event.inputs.only == 'utls' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        variant: [bun-h2-full, bun-h1-full]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.variant }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_tls"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "variant=${{ matrix.variant }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "VARIANT ${{ matrix.variant }} IP=$IP DIRTY"; exit 0; fi
          echo "VARIANT ${{ matrix.variant }} IP=$IP CLEAN"

          echo "=== build utls probe ==="
          (cd tools/utls_probe && go mod tidy >/dev/null 2>&1 && go build -o "$W/utls_probe" .)
          ls -l "$W/utls_probe"

          echo "=== probe: ${{ matrix.variant }} ==="
          "$W/utls_probe" tools/official_system_prompt.txt "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tls-${{ matrix.variant }}
          path: _tls

