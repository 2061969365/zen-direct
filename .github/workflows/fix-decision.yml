name: fix-decision

# Bun 传输下，最后二选一：
#   A: 现签 session + 12 工具（预期 200）→ 修复=补全工具集
#   B: opencode serve 现铸 session + 2 桩（网关 body）→ 若 200，修复=常驻 service
#   C: 现签 + 2 桩（对照，预期 429）
on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_fd"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          echo "=== boot opencode serve ==="
          nohup opencode serve --port 4096 >"$W/serve.log" 2>&1 &
          for i in $(seq 1 40); do grep -q 'server listening' "$W/serve.log" 2>/dev/null && break; sleep 1; done
          SVC_PW=$(grep -oP 'server password \K\S+' "$W/serve.log" | head -1)
          echo "pw=$([ -n "${SVC_PW:-}" ] && echo yes || echo no)"
          SVC_SES=$(python3 - "$SVC_PW" <<'PY'
          import base64, json, sys, urllib.request
          pw = sys.argv[1]
          basic = "Basic " + base64.b64encode(("opencode:" + pw).encode()).decode()
          req = urllib.request.Request("http://127.0.0.1:4096/api/session",
                                       data=json.dumps({"title": "fix decision"}).encode(),
                                       headers={"Authorization": basic, "Content-Type": "application/json"},
                                       method="POST")
          print(json.loads(urllib.request.urlopen(req, timeout=20).read())["data"]["id"])
          PY
          )
          echo "SVC_SES=$SVC_SES"
          [ -n "$SVC_SES" ] || exit 0

          cat > "$W/f.js" <<'JS'
          const fs = require("fs");
          const cli = JSON.parse(fs.readFileSync("tools/cli_capture_body.json").toString());
          const stubs = cli.tools.filter((t) => ["shell", "read"].includes(t.function.name));
          const body = (tools, text) => ({
            messages: [
              { role: "system", content: "You are an AI agent powered by DeepSeek Harness." },
              { role: "user", content: text }],
            model: "deepseek-v4.1-flash-free",
            stream: true,
            stream_options: { include_usage: true },
            tools,
          });
          function mint() {
            const ts = BigInt(Date.now());
            const n = ~((ts << 12n) + 1n) & ((1n << 64n) - 1n);
            const hx = "0123456789abcdef";
            let s = "ses_";
            for (let i = 0; i < 6; i++) {
              const b = Number((n >> BigInt(40 - 8 * i)) & 0xffn);
              s += hx[b >> 4] + hx[b & 0xf];
            }
            const al = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            for (let i = 0; i < 14; i++) s += al[Math.floor(Math.random() * al.length)];
            return s;
          }
          const url = "https://opencode.ai/inference/v1/chat/completions";
          async function send(tag, ses, b) {
            const headers = {
              "Authorization": "Bearer public",
              "Content-Type": "application/json",
              "User-Agent": "opencode/latest/2.0.29/cli",
              "X-Opencode-Client": "cli",
              "X-Opencode-Project": "global",
              "X-Opencode-Session": ses,
              "X-Opencode-Session-Id": ses,
              "X-Session-Affinity": ses,
              "X-Session-Id": ses,
            };
            const r = await fetch(url, { method: "POST", headers, body: JSON.stringify(b) });
            const t = await r.text();
            console.log(tag, "ses=" + ses.slice(0, 14), "->", r.status, JSON.stringify(t.slice(0, 110)));
          }
          await send("A minted+12tools", mint(), body(cli.tools, "fix decision A"));
          await send("B svc-session+2stubs", process.env.SVC_SES, body(stubs, "fix decision B"));
          await send("C minted+2stubs", mint(), body(stubs, "fix decision C"));
          JS
          SVC_SES="$SVC_SES" "$HOME/.bun/bin/bun" "$W/f.js" || echo "bun failed"
          pkill -f 'opencode serve' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fd-${{ matrix.shard }}
          path: _fd
