name: transport-fingerprint

# 同一台 runner、同一 IP、同一 session、同一 body，只换发送端：
#   B1 Bun fetch        （opencode CLI 的运行时）
#   N1 Node https
#   P1 Python https     （对照，预期 429）
# 判定：B1 200 → 传输层指纹（TLS/JA3）是根因；B1 429 → 还有别的。

on:
  workflow_dispatch:

jobs:
  fp:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          ls "$HOME/.bun/bin/bun" && "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_tf"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          REAL=$(python3 - <<'PY'
          import glob, os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          real = ""
          try:
              con = sqlite3.connect(db)
              for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
                  try:
                      rows = con.execute("select * from %s order by rowid desc limit 5" % t).fetchall()
                  except Exception:
                      continue
                  for row in rows:
                      for v in row:
                          if isinstance(v, str):
                              m = re.findall(r"ses_[0-9A-Za-z]{20,}", v)
                              if m:
                                  print(m[0]); raise SystemExit
          except SystemExit:
              raise
          except Exception as e:
              pass
          PY
          )
          echo "REAL=$REAL"
          [ -n "$REAL" ] || { echo "no real session"; exit 0; }

          cat > "$W/send.js" <<'JS'
          const fs = require("fs");
          const body = fs.readFileSync("tools/cli_capture_body.json");
          const ses = process.env.SES;
          const headers = {
            "Authorization": "Bearer public",
            "Content-Type": "application/json",
            "User-Agent": "opencode/latest/2.0.29/cli",
            "X-Opencode-Client": "cli",
            "X-Opencode-Project": "global",
            "X-Opencode-Session": ses,
            "X-Opencode-Session-Id": ses,
            "X-Session-Affinity": ses,
            "X-Session-Id": ses,
            "Content-Length": body.length,
          };
          const tag = process.argv[2];
          const mod = process.argv[3] === "bun" ? null : require("https");
          const url = "https://opencode.ai/inference/v1/chat/completions";
          (async () => {
            try {
              let res;
              if (process.argv[3] === "bun") {
                res = await fetch(url, { method: "POST", headers, body });
                const txt = await res.text();
                console.log(tag, "->", res.status, JSON.stringify(txt.slice(0, 140)),
                            "retry-after=", res.headers.get("retry-after"));
              } else {
                await new Promise((resolve) => {
                  const req = mod.request(url, { method: "POST", headers }, (r) => {
                    let d = "";
                    r.on("data", (c) => { d += c; });
                    r.on("end", () => {
                      console.log(tag, "->", r.statusCode, JSON.stringify(d.slice(0, 140)),
                                  "retry-after=", r.headers["retry-after"]);
                      resolve();
                    });
                  });
                  req.on("error", (e) => { console.log(tag, "-> ERR", e.message); resolve(); });
                  req.end(body);
                });
              }
            } catch (e) {
              console.log(tag, "-> ERR", e.message);
            }
          })();
          JS

          echo "=== B1: Bun ==="
          SES="$REAL" "$HOME/.bun/bin/bun" "$W/send.js" "B1 bun+real-session" bun || echo "bun failed"
          sleep 1
          echo "=== N1: Node ==="
          SES="$REAL" node "$W/send.js" "N1 node+real-session" node
          sleep 1
          echo "=== P1: Python (control) ==="
          SES="$REAL" python3 - <<'PY'
          import json, os
          from http.client import HTTPSConnection
          body = open("tools/cli_capture_body.json", "rb").read()
          ses = os.environ["SES"]
          conn = HTTPSConnection("opencode.ai", timeout=120)
          conn.putrequest("POST", "/inference/v1/chat/completions", skip_host=True, skip_accept_encoding=True)
          for k, v in {"Authorization": "Bearer public", "Content-Type": "application/json",
                       "User-Agent": "opencode/latest/2.0.29/cli", "X-Opencode-Client": "cli",
                       "X-Opencode-Project": "global", "X-Opencode-Session": ses,
                       "X-Opencode-Session-Id": ses, "X-Session-Affinity": ses,
                       "X-Session-Id": ses}.items():
              conn.putheader(k, v)
          conn.putheader("Host", "opencode.ai")
          conn.putheader("Content-Length", str(len(body)))
          conn.endheaders(); conn.send(body)
          r = conn.getresponse()
          print("P1 python+real-session ->", r.status, r.read(140), "retry-after=", r.getheader("Retry-After"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tf-${{ matrix.shard }}
          path: _tf
