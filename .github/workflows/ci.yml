name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go vet ./...
      - run: go test ./...
  linux-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build -trimpath -ldflags '-s -w' -o zen-direct-linux-amd64 .
      # mock upstream: canned responses envelope for POST, {} for GET /models
      - run: |
          cat > mock_up.py <<'EOF'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def _send(self, code, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  self._send(200, {"data": []})
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  self.rfile.read(n)
                  self._send(200, {"id": "resp_mock", "status": "completed",
                      "output": [{"id": "msg_mock", "type": "message", "role": "assistant",
                                  "content": [{"type": "output_text", "text": "CI-OK"}]}],
                      "usage": {"input_tokens": 1, "output_tokens": 1, "total_tokens": 2}})
              def log_message(self, *a):
                  pass
          HTTPServer(('127.0.0.1', 18091), H).serve_forever()
          EOF
          nohup python3 mock_up.py > mock.log 2>&1 &
          echo $! > mock.pid
      - run: |
          OPENCODE_ZEN_BASE=http://127.0.0.1:18091 PORT=18080 SHIM_SESSION_FILE=/tmp/ci-pool.json nohup ./zen-direct-linux-amd64 > gw.log 2>&1 &
          echo $! > gw.pid
          sleep 2
          curl -sf http://127.0.0.1:18080/health
      - run: |
          curl -sf -X POST http://127.0.0.1:18080/v1/responses \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: deepseek-harness/0.1.6' \
            -d '{"model":"test/muse-spark-1.3-contributor-free","stream":false,"input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"hi"}]}]}' \
            | grep -q CI-OK
      - run: |
          kill $(cat gw.pid) $(cat mock.pid) || true
          cat gw.log
  # Windows 真机跑 exe：build → mock 上游 → /health → 非流 responses → /ip 路由存在。
  # 补上此前只有 linux-smoke、Windows 只 vet/test 的缺口。
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: go build -trimpath -ldflags "-s -w" -o zen-direct.exe .
        env:
          CGO_ENABLED: "0"
      - name: Signature status (report only)
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature .\zen-direct.exe
          Write-Host "Authenticode Status: $($sig.Status)"
          # NotSigned 不 fail CI；Valid/UnknownError 等也只报告。
          # 真正校验在 verify-windows.ps1（本地/发布前）。
      - name: Start mock upstream
        shell: pwsh
        run: |
          @'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def _send(self, code, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  self._send(200, {"data": []})
              def do_POST(self):
                  n = int(self.headers.get("Content-Length", 0))
                  self.rfile.read(n)
                  self._send(200, {"id": "resp_mock", "status": "completed",
                      "output": [{"id": "msg_mock", "type": "message", "role": "assistant",
                                  "content": [{"type": "output_text", "text": "CI-OK"}]}],
                      "usage": {"input_tokens": 1, "output_tokens": 1, "total_tokens": 2}})
              def log_message(self, *a):
                  pass
          HTTPServer(("127.0.0.1", 18091), H).serve_forever()
          '@ | Set-Content -Path mock_up.py -Encoding utf8
          $p = Start-Process python -ArgumentList "mock_up.py" -PassThru -WindowStyle Hidden
          $p.Id | Set-Content mock.pid
          Start-Sleep 2
      - name: Start gateway + health
        shell: pwsh
        run: |
          $env:OPENCODE_ZEN_BASE = "http://127.0.0.1:18091"
          $env:PORT = "18080"
          $env:SHIM_SESSION_FILE = "$env:RUNNER_TEMP\ci-pool.json"
          $env:DIRECT_DIAG = "0"
          $env:DIRECT_DEBUG = "0"
          $g = Start-Process .\zen-direct.exe -PassThru -WindowStyle Hidden
          $g.Id | Set-Content gw.pid
          Start-Sleep 3
          $h = curl.exe -sf -m 5 http://127.0.0.1:18080/health
          if (-not $h) { throw "health check failed" }
          Write-Host "health: $h"
      - name: Non-stream responses smoke
        shell: pwsh
        run: |
          $body = '{"model":"test/muse-spark-1.3-contributor-free","stream":false,"input":[{"type":"message","role":"user","content":[{"type":"input_text","text":"hi"}]}]}'
          $r = curl.exe -sf -m 15 -X POST http://127.0.0.1:18080/v1/responses -H "Content-Type: application/json" -H "User-Agent: deepseek-harness/0.1.6" -d $body
          if (-not $r) { throw "non-stream smoke failed" }
          Write-Host $r
          if ($r -notmatch "CI-OK") { throw "response payload missing CI-OK" }
      - name: Routes exist (/ip GET, POST 404)
        shell: pwsh
        run: |
          # /ip 可能因 CI 出网受限 502，但路由必须存在（非 404）
          $code = curl.exe -s -o NUL -w "%{http_code}" -m 15 http://127.0.0.1:18080/ip
          Write-Host "GET /ip -> $code"
          if ($code -eq "404") { throw "/ip route missing" }
          $code2 = curl.exe -s -o NUL -w "%{http_code}" -m 5 -X POST http://127.0.0.1:18080/ip
          if ($code2 -ne "404") { throw "POST /ip should be 404, got $code2" }
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          if (Test-Path gw.pid) { Stop-Process -Id (Get-Content gw.pid) -Force -EA SilentlyContinue }
          if (Test-Path mock.pid) { Stop-Process -Id (Get-Content mock.pid) -Force -EA SilentlyContinue }
  build:
    needs: [test, linux-smoke, windows-smoke]
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            out: zen-direct-linux-amd64
          - os: windows-latest
            out: zen-direct.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go build -trimpath -ldflags '-s -w' -o ${{ matrix.out }} .
        env:
          CGO_ENABLED: '0'
      # 注：正式 Release 二进制走本地交叉编译 + `gh release create` 发附件；
      # Actions artifact 配额已满，不再经 artifact 中转。
