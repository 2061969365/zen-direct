name: replay-matrix

# 6 个分片并行，每个分片一台 runner（不同出口 IP）。
# 每个分片：先 CLI 直连控制组；429 说明这个 IP 的免费额度已耗尽 → 跳过。
# 干净 IP 上依次测：
#   C0 CLI 直连            （控制组，必须 200）
#   C1 CLI 经抓包代理       （Python TLS + CLI 头/体；429 则 TLS 指纹是关键）
#   C2 原样重放 CLI 请求    （同 session/头/体）
#   C3 只换 session 为现签  （测 session 来源）
#   C4 只换 project=global  （测 project 桶）
#   C5 网关默认            （global + 2 桩工具 + UA 2.0.29）

on:
  workflow_dispatch:

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: egress IP
        run: echo "IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')"
      - name: matrix shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_rm"; mkdir -p "$W"
          go build -trimpath -o zen-direct .
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          echo "=== C0: CLI direct (control) ==="
          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then
            echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY: $(tail -1 "$W/c0.err")"
            exit 0
          fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          python3 tools/capture_proxy.py --port 19100 --out "$W/cap" >"$W/proxy.log" 2>&1 &
          sleep 2

          echo "=== C1: CLI through capture proxy (Python TLS) ==="
          set +e
          OPENCODE_CONFIG_CONTENT='{"provider":{"opencode":{"options":{"baseURL":"http://127.0.0.1:19100/inference/v1"}}}}' \
            timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c1.out" 2>"$W/c1.err"
          C1=$?
          set -e
          echo "C1 exit=$C1 out=$(tail -1 "$W/c1.out") err=$(tail -1 "$W/c1.err")"

          echo "=== C2-C4: replays ==="
          cat > "$W/replay.py" <<'PY'
          import glob, json, random, time
          from http.client import HTTPSConnection

          caps = []
          for p in sorted(glob.glob("_rm/cap/*.json")):
              j = json.load(open(p, encoding="utf-8"))
              if j.get("method") == "POST":
                  caps.append(j)
          if not caps:
              print("no captures"); raise SystemExit
          ok = [c for c in caps if c.get("upstream_status") == 200]
          pick = ok[-1] if ok else caps[-1]
          print("capture used: upstream=%s bytes=%s" % (pick.get("upstream_status"), pick.get("body_len")))
          body = pick["body"]
          H = {k: v for k, v in pick["headers"].items()
               if k.lower() not in ("host", "content-length", "accept-encoding", "connection")}
          proj = H.get("x-opencode-project") or H.get("X-Opencode-Project") or ""
          ses = H.get("x-opencode-session") or H.get("X-Opencode-Session") or ""
          ua = H.get("user-agent") or H.get("User-Agent") or ""
          print("captured session=%s project=%s ua=%s" % (ses, proj, ua))

          def send(tag, headers, body):
              conn = HTTPSConnection("opencode.ai", timeout=180)
              conn.putrequest("POST", pick["path"], skip_host=True, skip_accept_encoding=True)
              for k, v in headers.items():
                  conn.putheader(k, v)
              conn.putheader("Host", "opencode.ai")
              conn.putheader("Content-Length", str(len(body.encode())))
              conn.endheaders()
              conn.send(body.encode())
              r = conn.getresponse()
              head = r.read(200).decode("utf-8", "replace")
              print("%s -> %s %r retry-after=%s" % (tag, r.status, head[:120], r.getheader("Retry-After")))
              conn.close()

          send("C2 replay-exact", H, body)

          def mint():
              ts = int(time.time() * 1000)
              n = (~(ts * 0x1000)) & ((1 << 64) - 1)
              hx = "0123456789abcdef"
              al = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
              s = "ses_" + "".join(
                  hx[((n >> (40 - 8 * i)) & 0xff) >> 4] + hx[((n >> (40 - 8 * i)) & 0xff) & 0xf]
                  for i in range(6))
              return s + "".join(random.choice(al) for _ in range(14))

          new = mint()
          h2 = dict(H)
          for k in list(h2):
              if k.lower() in ("x-opencode-session", "x-opencode-session-id",
                               "x-session-affinity", "x-session-id"):
                  h2[k] = new
          send("C3 minted-session(%s)" % new[:14], h2, body)

          h3 = dict(H)
          for k in list(h3):
              if k.lower() == "x-opencode-project":
                  h3[k] = "global"
          send("C4 project-global", h3, body)
          PY
          python3 "$W/replay.py"

          echo "=== C5: gateway default ==="
          mkdir -p "$W/gw"; : > "$W/gw/genuine.txt"
          nohup env PORT=18081 OPENCODE_ZEN_BASE=https://opencode.ai/inference/v1 \
            DIRECT_FRESH_PER_TURN=0 DIRECT_DEBUG=1 DIRECT_DIAG=1 SVC_OFF=1 \
            LOG_FILE="$W/gw/gw.log" SHIM_SESSION_FILE="$W/gw/shim.json" \
            DIRECT_POISON_FILE="$W/gw/poison.txt" GENUINE_SESSION_FILE="$W/gw/genuine.txt" \
            ./zen-direct >"$W/gw/gw.err" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:18081/health >/dev/null 2>&1 && break
            sleep 0.3
          done
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          body = json.dumps({"model": "deepseek-v4.1-flash-free", "stream": False,
                             "messages": [{"role": "system", "content": "You are an AI agent powered by DeepSeek Harness."},
                                          {"role": "user", "content": "replay matrix 42"}]}).encode()
          req = urllib.request.Request("http://127.0.0.1:18081/v1/chat/completions", data=body, method="POST")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print("C5 GW-default ->", r.status, r.read(100)[:100])
          except urllib.error.HTTPError as e:
              print("C5 GW-default ->", e.code, e.read(160)[:160], "retry-after=", e.headers.get("Retry-After"))
          PY
          pkill -f 'zen-direct' || true; pkill -f capture_proxy || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replay-${{ matrix.shard }}
          path: _rm
