name: shape-final

# Bun 传输 + 现签 session，只改 system 提示词，工具保留网关自己的：
#   Y1 官方提示词 + 网关 2 桩（shell/read，DSH 原始描述）
#   Y2 官方提示词 + 官方 12 工具
#   Y3 无官方提示词 + 网关 2 桩（对照，预期 429）
on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_sf"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          cat > "$W/y.js" <<'JS'
          const fs = require("fs");
          const cli = JSON.parse(fs.readFileSync("tools/cli_capture_body.json").toString());
          const OFFICIAL = cli.messages[0].content;
          const DSH = "You are an AI agent powered by DeepSeek Harness.\n\nYou are a coding agent.";
          const USER = "shape final check";
          // 网关实际发出去的那两个桩（描述与参数照抄 DSH 的）
          const GW_TOOLS = [
            { type: "function", function: {
                name: "shell",
                description: "Execute a shell command and return its output. Reserved for the host runtime; do not call or select this function. Use tools explicitly supplied by the user instead.",
                parameters: { additionalProperties: false, properties: {
                  background: { description: "Run the command in the background", type: "boolean" },
                  command: { description: "Shell command string to execute", type: "string" },
                  timeout: { description: "Timeout in milliseconds", minimum: 0, type: "integer" },
                  workdir: { description: "Working directory to execute the command in", type: "string" } },
                  required: ["command"], type: "object" } } },
            { type: "function", function: {
                name: "read",
                description: "Read the contents of a file or directory. Reserved for the host runtime; do not call or select this function. Use tools explicitly supplied by the user instead.",
                parameters: { additionalProperties: false, properties: {
                  limit: { description: "Maximum lines or directory entries to read", minimum: 0, type: "integer" },
                  offset: { description: "Starting line or directory entry (1-based)", minimum: 0, type: "integer" },
                  path: { description: "Path to read", type: "string" } },
                  required: ["path"], type: "object" } } },
          ];
          function mint() {
            const ts = BigInt(Date.now());
            const n = ~((ts << 12n) + 1n) & ((1n << 64n) - 1n);
            const hx = "0123456789abcdef";
            let s = "ses_";
            for (let i = 0; i < 6; i++) {
              const b = Number((n >> BigInt(40 - 8 * i)) & 0xffn);
              s += hx[b >> 4] + hx[b & 0xf];
            }
            const al = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            for (let i = 0; i < 14; i++) s += al[Math.floor(Math.random() * al.length)];
            return s;
          }
          const url = "https://opencode.ai/inference/v1/chat/completions";
          async function send(tag, messages, tools) {
            const ses = mint();
            const headers = {
              "Authorization": "Bearer public",
              "Content-Type": "application/json",
              "User-Agent": "opencode/latest/2.0.29/cli",
              "X-Opencode-Client": "cli",
              "X-Opencode-Project": "global",
              "X-Opencode-Session": ses,
              "X-Opencode-Session-Id": ses,
              "X-Session-Affinity": ses,
              "X-Session-Id": ses,
            };
            const body = { messages, model: "deepseek-v4.1-flash-free", stream: true,
                           stream_options: { include_usage: true }, tools };
            const r = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
            const t = await r.text();
            console.log(tag, "->", r.status, JSON.stringify(t.slice(0, 110)));
          }
          await send("Y1 official+gw2tools",
                     [{ role: "system", content: OFFICIAL }, { role: "system", content: DSH },
                      { role: "user", content: USER }], GW_TOOLS);
          await send("Y2 official+cli12tools",
                     [{ role: "system", content: OFFICIAL }, { role: "user", content: USER }], cli.tools);
          await send("Y3 dsh-only+gw2tools",
                     [{ role: "system", content: DSH }, { role: "user", content: USER }], GW_TOOLS);
          JS
          "$HOME/.bun/bin/bun" "$W/y.js" || echo "bun failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sf-${{ matrix.shard }}
          path: _sf
