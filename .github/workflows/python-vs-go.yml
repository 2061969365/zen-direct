name: python-vs-go

# 二分：请求形状 vs Go 传输层。
# 每个分片先跑 CLI 控制组；脏 IP 跳过。
# 干净 IP 上，用 Python 原样复刻网关的请求（同样的头、同样的 body、同样的 stream 形状）：
#   V1 gateway-shape via Python (UA 2.0.29)
#   V2 同上，UA 换 2.1.4
#   V3 网关本体（对照，预期 429）
# V1 200 → Go 的 TLS/传输指纹是根因；V1 429 → 请求形状是根因。

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_pg"; mkdir -p "$W"
          go build -trimpath -o zen-direct .
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then
            echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"
            exit 0
          fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          cat > "$W/v.py" <<'PY'
          import json, random, time, sys
          from http.client import HTTPSConnection

          TOOLS = [
              {"type": "function", "function": {
                  "description": "Execute a shell command and return its output. Reserved for the host runtime; do not call or select this function. Use tools explicitly supplied by the user instead.",
                  "name": "shell",
                  "parameters": {"additionalProperties": False, "properties": {
                      "background": {"description": "Run the command in the background", "type": "boolean"},
                      "command": {"description": "Shell command string to execute", "type": "string"},
                      "timeout": {"description": "Timeout in milliseconds", "minimum": 0, "type": "integer"},
                      "workdir": {"description": "Working directory to execute the command in", "type": "string"}},
                      "required": ["command"], "type": "object"}}},
              {"type": "function", "function": {
                  "description": "Read the contents of a file or directory. Reserved for the host runtime; do not call or select this function. Use tools explicitly supplied by the user instead.",
                  "name": "read",
                  "parameters": {"additionalProperties": False, "properties": {
                      "limit": {"description": "Maximum lines or directory entries to read", "minimum": 0, "type": "integer"},
                      "offset": {"description": "Starting line or directory entry (1-based)", "minimum": 0, "type": "integer"},
                      "path": {"description": "Path to read", "type": "string"}},
                      "required": ["path"], "type": "object"}}},
          ]

          def mint():
              ts = int(time.time() * 1000)
              n = (~(ts * 0x1000)) & ((1 << 64) - 1)
              hx = "0123456789abcdef"
              al = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789"
              s = "ses_" + "".join(
                  hx[((n >> (40 - 8 * i)) & 0xff) >> 4] + hx[((n >> (40 - 8 * i)) & 0xff) & 0xf]
                  for i in range(6))
              return s + "".join(random.choice(al) for _ in range(14))

          def send(tag, ua):
              ses = mint()
              body = json.dumps({
                  "messages": [
                      {"content": "You are an AI agent powered by DeepSeek Harness.", "role": "system"},
                      {"content": "python vs go check %d" % random.randrange(10**9), "role": "user"}],
                  "model": "deepseek-v4.1-flash-free",
                  "stream": True,
                  "stream_options": {"include_usage": True},
                  "tools": TOOLS}).encode()
              conn = HTTPSConnection("opencode.ai", timeout=120)
              conn.putrequest("POST", "/inference/v1/chat/completions",
                              skip_host=True, skip_accept_encoding=True)
              for k, v in {
                  "Authorization": "Bearer public",
                  "Content-Type": "application/json",
                  "User-Agent": ua,
                  "X-Opencode-Client": "cli",
                  "X-Opencode-Project": "global",
                  "X-Opencode-Session": ses,
                  "X-Opencode-Session-Id": ses,
                  "X-Session-Affinity": ses,
                  "X-Session-Id": ses,
              }.items():
                  conn.putheader(k, v)
              conn.putheader("Host", "opencode.ai")
              conn.putheader("Content-Length", str(len(body)))
              conn.endheaders()
              conn.send(body)
              r = conn.getresponse()
              head = r.read(160).decode("utf-8", "replace")
              print("%s -> %s %r retry-after=%s" % (tag, r.status, head[:140], r.getheader("Retry-After")))
              conn.close()

          send("V1 gateway-shape python UA2.0.29", "opencode/latest/2.0.29/cli")
          send("V2 gateway-shape python UA2.1.4", "opencode/latest/2.1.4/cli")
          PY
          echo "=== V1/V2: python replay of the gateway shape ==="
          python3 "$W/v.py"

          echo "=== V3: gateway itself ==="
          mkdir -p "$W/gw"; : > "$W/gw/genuine.txt"
          nohup env PORT=18081 OPENCODE_ZEN_BASE=https://opencode.ai/inference/v1 \
            DIRECT_FRESH_PER_TURN=0 DIRECT_DEBUG=1 DIRECT_DIAG=1 SVC_OFF=1 \
            LOG_FILE="$W/gw/gw.log" SHIM_SESSION_FILE="$W/gw/shim.json" \
            DIRECT_POISON_FILE="$W/gw/poison.txt" GENUINE_SESSION_FILE="$W/gw/genuine.txt" \
            ./zen-direct >"$W/gw/gw.err" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -m 2 http://127.0.0.1:18081/health >/dev/null 2>&1 && break
            sleep 0.3
          done
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          body = json.dumps({"model": "deepseek-v4.1-flash-free", "stream": False,
                             "messages": [{"role": "system", "content": "You are an AI agent powered by DeepSeek Harness."},
                                          {"role": "user", "content": "python vs go 42"}]}).encode()
          req = urllib.request.Request("http://127.0.0.1:18081/v1/chat/completions", data=body, method="POST")
          req.add_header("Content-Type", "application/json")
          try:
              with urllib.request.urlopen(req, timeout=120) as r:
                  print("V3 GW ->", r.status, r.read(100)[:100])
          except urllib.error.HTTPError as e:
              print("V3 GW ->", e.code, e.read(160)[:160], "retry-after=", e.headers.get("Retry-After"))
          PY
          pkill -f 'zen-direct' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-vs-go-${{ matrix.shard }}
          path: _pg
