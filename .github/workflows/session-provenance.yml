name: session-provenance

# 同一台 runner、同一 IP：
#   S1 真实 opencode run 产生的 session id + CLI body
#   S2 同一真实 session + 网关 body（2 桩工具）
#   S3 现签 session + CLI body
#   S4 现签 session + 网关 body
# 判定：S1 200 + S3 429 → 只有“真跑过一次”的 session 才有额度。

on:
  workflow_dispatch:

jobs:
  prov:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_sp"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" --print-logs --log-level debug \
            >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then
            echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"
            exit 0
          fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          echo "--- session ids seen in CLI logs ---"
          grep -oE 'ses_[0-9A-Za-z]{20,}' "$W/c0.err" | sort | uniq -c | sort -rn | head -8 || true
          REAL=$(grep -oE 'ses_[0-9A-Za-z]{20,}' "$W/c0.err" | sort | uniq -c | sort -rn | head -1 | awk '{print $2}')
          echo "REAL_SESSION=$REAL"
          if [ -z "${REAL:-}" ]; then echo "no session id found"; exit 0; fi

          cat > "$W/s.py" <<'PY'
          import copy, json, os, random, time
          from http.client import HTTPSConnection

          base = json.load(open("tools/cli_capture_body.json", encoding="utf-8"))
          real = os.environ["REAL_SESSION"]

          def mint():
              ts = int(time.time() * 1000)
              n = (~(ts * 0x1000)) & ((1 << 64) - 1)
              hx = "0123456789abcdef"
              al = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz"
              s = "ses_" + "".join(
                  hx[((n >> (40 - 8 * i)) & 0xff) >> 4] + hx[((n >> (40 - 8 * i)) & 0xff) & 0xf]
                  for i in range(6))
              return s + "".join(random.choice(al) for _ in range(14))

          GW_BODY = {
              "messages": [
                  {"content": "You are an AI agent powered by DeepSeek Harness.", "role": "system"},
                  {"content": "session provenance check 9", "role": "user"}],
              "model": "deepseek-v4.1-flash-free",
              "stream": True,
              "stream_options": {"include_usage": True},
              "tools": base["tools"][:2],
          }

          def send(tag, ses, body):
              raw = json.dumps(body).encode()
              conn = HTTPSConnection("opencode.ai", timeout=120)
              conn.putrequest("POST", "/inference/v1/chat/completions",
                              skip_host=True, skip_accept_encoding=True)
              for k, v in {
                  "Authorization": "Bearer public",
                  "Content-Type": "application/json",
                  "User-Agent": "opencode/latest/2.0.29/cli",
                  "X-Opencode-Client": "cli",
                  "X-Opencode-Project": "global",
                  "X-Opencode-Session": ses,
                  "X-Opencode-Session-Id": ses,
                  "X-Session-Affinity": ses,
                  "X-Session-Id": ses,
              }.items():
                  conn.putheader(k, v)
              conn.putheader("Host", "opencode.ai")
              conn.putheader("Content-Length", str(len(raw)))
              conn.endheaders()
              conn.send(raw)
              r = conn.getresponse()
              head = r.read(160).decode("utf-8", "replace")
              print("%s -> %s %r retry-after=%s" % (tag, r.status, head[:130], r.getheader("Retry-After")))
              conn.close()

          send("S1 real-session + cli-body", real, copy.deepcopy(base))
          send("S2 real-session + gw-body", real, GW_BODY)
          send("S3 minted-session + cli-body", mint(), copy.deepcopy(base))
          send("S4 minted-session + gw-body", mint(), GW_BODY)
          PY
          REAL_SESSION="$REAL" python3 "$W/s.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: session-provenance-${{ matrix.shard }}
          path: _sp
