name: stub-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g opencode-ai@1.18.31
      # transparent record-and-forward proxy: opencode -> 18092 -> real zen upstream
      - run: |
          cat > forward_rec.py <<'EOF'
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
          import json, shutil, urllib.request
          UP = "https://opencode.ai/zen"
          class H(BaseHTTPRequestHandler):
              def _fwd(self):
                  n = int(self.headers.get('Content-Length', 0))
                  raw = self.rfile.read(n) if n else b''
                  if self.command == 'POST':
                      try:
                          rec = {"path": self.path,
                                 "headers": {k: v for k, v in self.headers.items()},
                                 "body": json.loads(raw.decode())}
                      except Exception as e:
                          rec = {"path": self.path, "parse_error": str(e),
                                 "raw_prefix": raw[:500].decode('utf-8', 'replace')}
                      open('recorded_full.json', 'w').write(json.dumps(rec))
                  hdrs = {k: v for k, v in self.headers.items()
                          if k.lower() not in ('host', 'content-length', 'connection')}
                  req = urllib.request.Request(UP + self.path, data=raw if self.command == 'POST' else None,
                                               method=self.command, headers=hdrs)
                  try:
                      up = urllib.request.urlopen(req, timeout=120)
                      self.send_response(up.status)
                      ct = up.headers.get('Content-Type', 'application/octet-stream')
                      self.send_header('Content-Type', ct)
                      self.end_headers()
                      if self.command == 'POST':
                          open('gate_status.txt', 'w').write(str(up.status))
                      shutil.copyfileobj(up, self.wfile, length=65536)
                  except Exception as e:
                      code = getattr(e, 'code', 599)
                      eb = str(e)[:500]
                      self.send_response(502)
                      self.send_header('Content-Type', 'text/plain')
                      self.end_headers()
                      try:
                          self.wfile.write(("FORWARDER_UPSTREAM_FAIL %s %s" % (code, eb)).encode())
                      except Exception:
                          pass
                      if self.command == 'POST':
                          open('gate_status.txt', 'w').write('UPSTREAM_FAIL %s %s' % (code, eb))
              def do_POST(self):
                  self._fwd()
              def do_GET(self):
                  self._fwd()
              def log_message(self, *a):
                  pass
          ThreadingHTTPServer(('127.0.0.1', 18092), H).serve_forever()
          EOF
          nohup python3 forward_rec.py > fwd.log 2>&1 &
          echo $! > fwd.pid
      # clean-machine opencode config: no MCPs, probe provider -> forwarder, apiKey public
      - run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {"$schema": "https://opencode.ai/config.json",
           "agent": {"bypass": {"mode": "primary", "permission": {"*": "allow"}}},
           "provider": {"probe": {"npm": "@ai-sdk/openai",
             "options": {"apiKey": "public", "baseURL": "http://127.0.0.1:18092/v1"},
             "models": {"muse-spark-1.3-contributor-free": {"name": "muse-spark-1.3-contributor-free"}}}}}
          EOF
      - run: |
          set +e
          timeout 150 opencode run --pure --agent bypass -m probe/muse-spark-1.3-contributor-free "Reply with exactly: PONG" > run_out.txt 2>&1
          echo "RUN_EXIT=$?"
          echo "--- run_out tail ---"; tail -c 1500 run_out.txt; echo
          echo "--- fwd.log ---"; cat fwd.log; echo
          echo "--- gate_status ---"; cat gate_status.txt 2>/dev/null || echo "NO GATE STATUS"
          true
      # verdict: what did genuine clean opencode send, and did the gate let it through?
      - if: always()
        run: |
          echo "=== gate_status ==="; cat gate_status.txt 2>/dev/null || echo "NO GATE STATUS RECORDED"
          echo "=== gate_status ==="; cat gate_status.txt 2>/dev/null || echo "NO GATE STATUS RECORDED"
          python3 - <<'EOF'
          import json
          rec = json.load(open('recorded_full.json'))
          b = rec.get('body', {})
          print("PATH:", rec['path'])
          hdrs = rec.get('headers', {})
          print("REQ_HEADERS:", json.dumps({k: v for k, v in hdrs.items()
                if 'opencode' in k.lower() or 'user-agent' in k.lower()
                or 'session' in k.lower() or 'authorization' in k.lower()}, indent=1))
          print("BODY_KEYS:", list(b.keys()) if isinstance(b, dict) else type(b))
          if isinstance(b, dict) and isinstance(b.get('tools'), list):
              print("NTOOLS:", len(b['tools']))
              print("NAMES:", sorted(t.get('function', {}).get('name', t.get('name')) for t in b['tools']))
              print("STORE:", b.get('store'), "| STREAM:", b.get('stream'),
                    "| TOOL_CHOICE:", b.get('tool_choice'), "| MAXTOK:", b.get('max_output_tokens'))
              print("HAS_PROMPT_CACHE_KEY:", 'prompt_cache_key' in b, "| REASONING:", json.dumps(b.get('reasoning')))
          EOF
      - run: kill $(cat fwd.pid) || true
