name: stub-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g opencode-ai@1.18.31
      # mock upstream: record request (headers+body), reply canned completed envelope
      - run: |
          cat > mock_rec.py <<'EOF'
          from http.server import BaseHTTPRequestHandler, HTTPServer
          import json
          class H(BaseHTTPRequestHandler):
              def _send(self, code, obj):
                  b = json.dumps(obj).encode()
                  self.send_response(code)
                  self.send_header('Content-Type', 'application/json')
                  self.send_header('Content-Length', str(len(b)))
                  self.end_headers()
                  self.wfile.write(b)
              def do_GET(self):
                  self._send(200, {"data": []})
              def do_POST(self):
                  n = int(self.headers.get('Content-Length', 0))
                  raw = self.rfile.read(n)
                  rec = {"path": self.path,
                         "headers": {k: v for k, v in self.headers.items()},
                         "body": json.loads(raw.decode())}
                  open('recorded.json', 'w').write(json.dumps(rec))
                  self._send(200, {"id": "resp_mock", "status": "completed",
                      "output": [{"id": "msg_mock", "type": "message", "role": "assistant",
                                  "content": [{"type": "output_text", "text": "PROBE-OK"}]}],
                      "usage": {"input_tokens": 1, "output_tokens": 1, "total_tokens": 2}})
              def log_message(self, *a):
                  pass
          HTTPServer(('127.0.0.1', 18091), H).serve_forever()
          EOF
          nohup python3 mock_rec.py > mock.log 2>&1 &
          echo $! > mock.pid
      # clean-machine opencode config: no MCPs, probe provider -> mock
      - run: |
          mkdir -p ~/.config/opencode
          cat > ~/.config/opencode/opencode.json <<'EOF'
          {"$schema": "https://opencode.ai/config.json",
           "agent": {"bypass": {"mode": "primary", "permission": {"*": "allow"}}},
           "provider": {"probe": {"npm": "@ai-sdk/openai",
             "options": {"apiKey": "notneed", "baseURL": "http://127.0.0.1:18091/v1"},
             "models": {"muse-spark-1.3-contributor-free": {"name": "muse-spark-1.3-contributor-free"}}}}}
          EOF
      - run: |
          timeout 150 opencode run --pure --agent bypass -m probe/muse-spark-1.3-contributor-free "Reply with exactly: PONG" || echo "RUN_EXIT=$?"
      # what did clean opencode send?
      - run: |
          python3 - <<'EOF'
          import json
          rec = json.load(open('recorded.json'))
          b = rec['body']
          print("PATH:", rec['path'])
          print("REQ_HEADERS:", json.dumps({k: v for k, v in rec['headers'].items() if 'opencode' in k.lower() or 'user-agent' in k.lower() or 'session' in k.lower()}, indent=1))
          print("BODY_KEYS:", list(b.keys()))
          tools = b.get('tools', 'ABSENT')
          if isinstance(tools, list):
              print("NTOOLS:", len(tools))
              print("NAMES:", sorted(t.get('function', {}).get('name', t.get('name')) for t in tools))
          else:
              print("TOOLS:", tools)
          print("MODEL:", b.get('model'), "| STREAM:", b.get('stream'), "| STORE:", b.get('store'))
          print("REASONING:", json.dumps(b.get('reasoning')))
          EOF
      # replay the clean tool list against the REAL gate
      - run: |
          python3 - <<'EOF'
          import json, secrets, urllib.request
          rec = json.load(open('recorded.json'))
          b = rec['body']
          tools = b.get('tools')
          names = []
          if isinstance(tools, list):
              for t in tools:
                  n = t.get('function', {}).get('name', t.get('name'))
                  if n: names.append(n)
          print("REPLAYING", len(names), "clean-machine tool names")
          ses = 'ses_' + ''.join(secrets.choice('0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ') for _ in range(24))
          body = {"model": "muse-spark-1.3-contributor-free", "stream": True,
                  "input": [{"role": "user", "content": [{"type": "input_text", "text": "Reply with exactly: PONG"}]}]}
          if names:
              body["tools"] = [{"type": "function", "name": n, "description": "probe",
                                "parameters": {"type": "object", "properties": {}}} for n in names]
          req = urllib.request.Request("https://opencode.ai/zen/v1/responses",
              data=json.dumps(body).encode(), method="POST", headers={
              "Authorization": "Bearer public", "Content-Type": "application/json",
              "User-Agent": "opencode/1.18.31 ai-sdk/provider-utils/4.0.40 runtime/bun/1.3.14",
              "X-Opencode-Session": ses, "X-Opencode-Client": "opencode",
              "X-Opencode-Project": "default", "X-Opencode-Request": "msg_probe1"})
          try:
              with urllib.request.urlopen(req, timeout=90) as r:
                  print("GATE_STATUS:", r.status, "(clean tool list PASSES)" if r.status == 200 else "")
                  r.read(200)
          except Exception as e:
              print("GATE_STATUS: FAIL", str(e)[:200])
          EOF
      - run: kill $(cat mock.pid) || true
