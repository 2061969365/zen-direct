name: bun-2x2

# Bun fetch 传输下：session（真/现签）× body（CLI 12 工具 / 网关 2 桩）
#   B1 real#1 + cli-body
#   B2 minted#1 + cli-body
#   B3 real#2 + gw-body
#   B4 minted#2 + gw-body
# 两个真 session 来自两次独立的 opencode run，避免同一 session 被重复消耗。
on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_b2"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: two" >"$W/c0b.out" 2>"$W/c0b.err"
          echo "C0b exit=$? out=$(tail -1 "$W/c0b.out")"
          set -e

          python3 - <<'PY' > "$W/sessions.txt"
          import os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          seen = []
          con = sqlite3.connect(db)
          for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
              try:
                  rows = con.execute("select * from %s order by rowid desc limit 40" % t).fetchall()
              except Exception:
                  continue
              for row in rows:
                  for v in row:
                      if isinstance(v, str):
                          for m in re.findall(r"ses_[0-9A-Za-z]{20,}", v):
                              if m not in seen:
                                  seen.append(m)
          for s in seen[:2]:
              print(s)
          PY
          echo "sessions:"; cat "$W/sessions.txt"
          REAL1=$(sed -n 1p "$W/sessions.txt"); REAL2=$(sed -n 2p "$W/sessions.txt")
          echo "REAL1=$REAL1 REAL2=$REAL2"
          [ -n "$REAL1" ] && [ -n "$REAL2" ] || { echo "need two real sessions"; exit 0; }

          cat > "$W/x.js" <<'JS'
          const fs = require("fs");
          const cli = JSON.parse(fs.readFileSync("tools/cli_capture_body.json").toString());
          const gw = {
            messages: [
              { role: "system", content: "You are an AI agent powered by DeepSeek Harness." },
              { role: "user", content: "bun 2x2 check" }],
            model: "deepseek-v4.1-flash-free",
            stream: true,
            stream_options: { include_usage: true },
            tools: [
              { type: "function", function: { name: "shell", description: "run shell", parameters: { type: "object", properties: { command: { type: "string" } }, required: ["command"] } } },
              { type: "function", function: { name: "read", description: "read file", parameters: { type: "object", properties: { path: { type: "string" } }, required: ["path"] } } },
            ],
          };
          function mint() {
            const ts = BigInt(Date.now());
            let n = ~((ts << 12n) + 1n) & ((1n << 64n) - 1n);
            const hx = "0123456789abcdef";
            let s = "ses_";
            for (let i = 0; i < 6; i++) {
              const b = Number((n >> BigInt(40 - 8 * i)) & 0xffn);
              s += hx[b >> 4] + hx[b & 0xf];
            }
            const al = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz";
            for (let i = 0; i < 14; i++) s += al[Math.floor(Math.random() * al.length)];
            return s;
          }
          const url = "https://opencode.ai/inference/v1/chat/completions";
          async function send(tag, ses, body) {
            const headers = {
              "Authorization": "Bearer public",
              "Content-Type": "application/json",
              "User-Agent": "opencode/latest/2.0.29/cli",
              "X-Opencode-Client": "cli",
              "X-Opencode-Project": "global",
              "X-Opencode-Session": ses,
              "X-Opencode-Session-Id": ses,
              "X-Session-Affinity": ses,
              "X-Session-Id": ses,
            };
            const r = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
            const t = await r.text();
            console.log(tag, "ses=" + ses.slice(0, 14), "->", r.status, JSON.stringify(t.slice(0, 110)));
          }
          await send("B1 real1+cli-body", process.env.REAL1, cli);
          await send("B2 minted+cli-body", mint(), cli);
          await send("B3 real2+gw-body", process.env.REAL2, gw);
          await send("B4 minted+gw-body", mint(), gw);
          JS
          REAL1="$REAL1" REAL2="$REAL2" "$HOME/.bun/bin/bun" "$W/x.js" || echo "bun failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b2-${{ matrix.shard }}
          path: _b2
