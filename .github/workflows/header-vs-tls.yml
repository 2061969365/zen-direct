name: header-vs-tls

# 同一 IP / 同一 session / 同一 body：
#   B1 bun fetch            （预期 200，对照）
#   B2 bun 的 node:https     （同运行时、不同头集合）
#   N2 node https + 手工补 Bun 那套头
#   E1 本地回显：Bun fetch 到底加了哪些头（不碰上游）
# 判定：N2 200 → 只是头的问题；B2 200 而 N2 429 → TLS 指纹。

on:
  workflow_dispatch:

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: install opencode CLI
        run: |
          npm install -g @opencode/cli@latest 2>&1 | tail -1
          opencode --version
      - name: install bun
        run: |
          curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          "$HOME/.bun/bin/bun" --version || echo "no bun"
      - name: shard ${{ matrix.shard }}
        run: |
          set -u
          export PATH="$HOME/.npm-global/bin:$HOME/.bun/bin:$PATH"
          export OPENCODE_DISABLE_AUTOUPDATE=1
          W="$PWD/_hv"; mkdir -p "$W"
          IP=$(curl -s -m 15 http://ip-api.com/json | python3 -c 'import json,sys; print(json.load(sys.stdin)["query"])')
          echo "shard=${{ matrix.shard }} ip=$IP"

          set +e
          timeout 180 opencode run -m opencode/deepseek-v4.1-flash-free \
            "Reply with the single word: ok" >"$W/c0.out" 2>"$W/c0.err"
          C0=$?
          set -e
          echo "C0 exit=$C0 out=$(tail -1 "$W/c0.out")"
          if [ "$C0" != "0" ]; then echo "SHARD ${{ matrix.shard }} IP=$IP DIRTY"; exit 0; fi
          echo "SHARD ${{ matrix.shard }} IP=$IP CLEAN"

          REAL=$(python3 - <<'PY'
          import os, re, sqlite3
          db = os.path.expanduser("~/.local/share/opencode/opencode.db")
          try:
              con = sqlite3.connect(db)
              for t in [r[0] for r in con.execute("select name from sqlite_master where type='table'")]:
                  try:
                      rows = con.execute("select * from %s order by rowid desc limit 5" % t).fetchall()
                  except Exception:
                      continue
                  for row in rows:
                      for v in row:
                          if isinstance(v, str):
                              m = re.findall(r"ses_[0-9A-Za-z]{20,}", v)
                              if m:
                                  print(m[0]); raise SystemExit
          except SystemExit:
              raise
          except Exception:
              pass
          PY
          )
          echo "REAL=$REAL"; [ -n "$REAL" ] || exit 0

          echo "=== E1: what Bun fetch sends (local echo) ==="
          cat > "$W/echo.js" <<'JS'
          const srv = require("http").createServer((req, res) => {
            console.log("ECHO_HEADERS " + JSON.stringify(req.headers));
            res.end("ok");
          });
          srv.listen(19999, "127.0.0.1", async () => {
            await fetch("http://127.0.0.1:19999/x", { method: "POST", body: "{}" });
            srv.close();
          });
          JS
          "$HOME/.bun/bin/bun" "$W/echo.js" 2>/dev/null | grep ECHO_HEADERS || true

          cat > "$W/send.js" <<'JS'
          const fs = require("fs");
          const body = fs.readFileSync("tools/cli_capture_body.json");
          const ses = process.env.SES;
          const base = {
            "Authorization": "Bearer public",
            "Content-Type": "application/json",
            "User-Agent": "opencode/latest/2.0.29/cli",
            "X-Opencode-Client": "cli",
            "X-Opencode-Project": "global",
            "X-Opencode-Session": ses,
            "X-Opencode-Session-Id": ses,
            "X-Session-Affinity": ses,
            "X-Session-Id": ses,
            "Content-Length": String(body.length),
          };
          const bunish = Object.assign({}, base, {
            "Accept": "*/*",
            "Accept-Encoding": "gzip, deflate, br, zstd",
            "Connection": "keep-alive",
          });
          const url = "https://opencode.ai/inference/v1/chat/completions";
          const mode = process.argv[2];
          const tag = process.argv[3];
          (async () => {
            try {
              if (mode === "fetch") {
                const r = await fetch(url, { method: "POST", headers: base, body });
                const t = await r.text();
                console.log(tag, "->", r.status, JSON.stringify(t.slice(0, 120)));
              } else if (mode === "bunhttps") {
                const https = require("https");
                await new Promise((res) => {
                  const q = https.request(url, { method: "POST", headers: base }, (r) => {
                    let d = ""; r.on("data", (c) => d += c);
                    r.on("end", () => { console.log(tag, "->", r.statusCode, JSON.stringify(d.slice(0, 120))); res(); });
                  });
                  q.on("error", (e) => { console.log(tag, "ERR", e.message); res(); });
                  q.end(body);
                });
              } else {
                const https = require("https");
                await new Promise((res) => {
                  const q = https.request(url, { method: "POST", headers: bunish }, (r) => {
                    let d = ""; r.on("data", (c) => d += c);
                    r.on("end", () => { console.log(tag, "->", r.statusCode, JSON.stringify(d.slice(0, 120))); res(); });
                  });
                  q.on("error", (e) => { console.log(tag, "ERR", e.message); res(); });
                  q.end(body);
                });
              }
            } catch (e) { console.log(tag, "ERR", e.message); }
          })();
          JS

          echo "=== B1: bun fetch ==="
          SES="$REAL" "$HOME/.bun/bin/bun" "$W/send.js" fetch "B1 bun-fetch" || echo "bun failed"
          sleep 1
          echo "=== B2: bun node:https ==="
          SES="$REAL" "$HOME/.bun/bin/bun" "$W/send.js" bunhttps "B2 bun-nodehttps" || echo "bun https failed"
          sleep 1
          echo "=== N2: node https + bun headers ==="
          SES="$REAL" node "$W/send.js" nodebun "N2 node-bunheaders"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hv-${{ matrix.shard }}
          path: _hv
